# GigSim remains isolated from GigBid. Run from the root with `make dev`.

services:
  gigsim-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigsim
      POSTGRES_PASSWORD: gigsim
      POSTGRES_DB: gigsim
    ports:
      - "5433:5432"
    volumes:
      - gigsim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigsim -d gigsim"]
      interval: 5s
      timeout: 3s
      retries: 12

  gigsim:
    build:
      context: ..
      dockerfile: infra/docker/gigsim.Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      # Inside the compose network Postgres is reachable by service name, not localhost.
      GIGSIM_DATABASE_URL: postgresql+asyncpg://gigsim:gigsim@gigsim-postgres:5432/gigsim
    depends_on:
      gigsim-postgres:
        condition: service_healthy
    volumes:
      # Seed data is read from data/processed (generated by data/scripts/process.py).
      - ../data/processed:/app/data/processed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gigbid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigbid}
      POSTGRES_DB: ${POSTGRES_DB:-gigbid}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gigbid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: gigbid-python:local
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    env_file: ../.env
    environment: &gigbid_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gigbid}:${POSTGRES_PASSWORD:-gigbid}@postgres:5432/${POSTGRES_DB:-gigbid}
      REDIS_URL: redis://redis:6379/0
      GIGSIM_BASE_URL: http://gigsim:8081
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      CHROMA_HOST: vector-store
      CHROMA_PORT: 8000
      PORTFOLIO_MCP_URL: http://portfolio-mcp:8000/mcp
      MARKETPLACE_MCP_URL: http://marketplace-mcp:8000/mcp
      WORKSPACE_MCP_URL: http://workspace-mcp:8000/mcp
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: gigbid-python:local
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    env_file: ../.env
    environment: *gigbid_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

  worker:
    image: gigbid-python:local
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    env_file: ../.env
    environment: *gigbid_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["arq", "worker.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.settings.WorkerSettings"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5

  portfolio-mcp:
    image: gigbid-python:local
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    env_file: ../.env
    environment:
      <<: *gigbid_env
      MCP_BASE_URL: http://localhost:8101
    command: ["uvicorn", "mcp_servers.portfolio.server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8101:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
    volumes:
      - ../data/personas:/app/data/personas:ro

  marketplace-mcp:
    image: gigbid-python:local
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    env_file: ../.env
    environment:
      <<: *gigbid_env
      MCP_BASE_URL: http://localhost:8102
    command: ["uvicorn", "mcp_servers.marketplace.server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8102:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

  workspace-mcp:
    image: gigbid-python:local
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    env_file: ../.env
    environment:
      <<: *gigbid_env
      MCP_BASE_URL: http://localhost:8103
    command: ["uvicorn", "mcp_servers.workspace.server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8103:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

  vector-store:
    image: chromadb/chroma:1.3.5
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; printf \"GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 6

  # Linux host-network bridge reuses the user's existing loopback-only Ollama.
  # No container model runtime, copied model files, or automatic downloads.
  ollama:
    image: gigbid-python:local
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "infra/ollama_bridge.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://host.docker.internal:11435/api/tags', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 6

volumes:
  gigsim_pgdata:
  gigbid_pgdata:
  redis_data:
  chroma_data:
