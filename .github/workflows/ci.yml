name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gigbid
          POSTGRES_PASSWORD: gigbid
          POSTGRES_DB: foundation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gigbid -d foundation_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      FOUNDATION_TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://gigbid:gigbid@localhost:5432/foundation_test
      FOUNDATION_TEST_DATABASE_URL: postgresql+asyncpg://gigbid:gigbid@localhost:5432/foundation_test
      GRAPH_TEST_DATABASE_URL: postgresql+asyncpg://gigbid:gigbid@localhost:5432/foundation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --frozen --extra dev
      - run: make lint
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: make test
      - run: uv run python -m scripts.export_openapi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make web-install
      - run: cd apps/web && npm run api:generate
      - run: git diff --exit-code -- apps/web/openapi.json apps/web/src/lib/api/schema.d.ts
      - run: make web-check
