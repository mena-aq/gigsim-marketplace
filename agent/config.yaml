marketplace:
  mode: gigsim
  max_requests_per_minute: 20

models:
  embeddings: all-minilm:22m
  reranker: cross-encoder/ms-marco-MiniLM-L6-v2

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 48000

thresholds:
  minimum_fit_score: 0.40
  maximum_risk_score: 0.80

profiles:
  open:
    analyst: qwen2.5:3b
    risk: qwen2.5:3b
    matcher: qwen2.5:3b
    pricing: qwen2.5:3b
    writer: qwen2.5:3b
    critic: qwen2.5:3b
    compliance: qwen2.5:3b
    intent: qwen2.5:3b
    liaison: qwen2.5:3b
    fallback: qwen2.5:3b

orchestration:
  node_timeout_seconds: 600
  model_timeout_seconds: 300
  context_tokens: 8192
  output_tokens: 768
  output_tokens_by_role: {matcher: 1536, writer: 1024}
  max_input_characters: 24000
  node_attempts: 2
  max_run_attempts: 5
  approval_minutes: 30
  cheap_nodes: [analyst, risk, matcher, pricing, compliance, intent]
  minimum_price: 100
  minimum_connects_reserve: 8
  max_proposal_words: 300
  policy_file: data/policy_pack/rules.md
  enforcement_file: data/policy_pack/enforcement.yaml
  risk_levels: {none: 0.1, caution: 0.5, high: 0.9}
  missing_client_risk: 0.4
  unverified_payment_risk: 0.5
  low_hire_rate: 0.1
  low_hire_rate_risk: 0.8
  writer_words: 80
  screening_answer_words: 25
  writer_characters: 900
  screening_answer_characters: 400

rag:
  active_variant: v0
  chunk_tokens: 200
  overlap_tokens: 40
  candidate_k: 20
  rrf_constant: 60
  embedding_dimensions: 384
  embedding_context_tokens: 256
  tokenizer_model: sentence-transformers/all-MiniLM-L6-v2
  tokenizer_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  reranker_revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  reranker_file: onnx/model.onnx
  llm_model: qwen2.5:3b
  llm_context_tokens: 8192
  llm_output_tokens: 768
  llm_timeout_seconds: 180
  llm_budget_seconds: 240
  max_requirements: 6
  grade_candidates: 5
  proposal_words: 80
  cpu_threads: 6
